resources:
  jobs:
    shogi_kif_job:
      name: shogi_kif_job
      parameters:
        - name: catalog
          default: ${var.catalog}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies: ${var.wheel_dependencies}
      queue:
        enabled: false
      max_concurrent_runs: 1
      tasks:
        - task_key: shogi_kif_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.shogi_kif_pipeline.id}

    floodgate_job:
      name: floodgate_job
      parameters:
        - name: catalog
          default: ${var.catalog}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies: ${var.wheel_dependencies}
      queue:
        enabled: false
      max_concurrent_runs: 1
      tasks:
        - task_key: floodgate
          environment_key: default
          max_retries: 0
          disable_auto_optimization: true
          python_wheel_task:
            package_name: shogi-kif-rag
            entry_point: floodgate

    joseki_job:
      name: joseki_job
      parameters:
        - name: catalog
          default: ${var.catalog}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies: ${var.wheel_dependencies}
      queue:
        enabled: false
      max_concurrent_runs: 1
      tasks:
        - task_key: wikipedia_raw
          environment_key: default
          max_retries: 0
          disable_auto_optimization: true
          python_wheel_task:
            package_name: shogi-kif-rag
            entry_point: wikipedia_raw
            named_parameters:
              catalog: "{{job.parameters.catalog}}"
              bronze_schema: ${var.bronze_schema}
        - task_key: joseki_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.joseki_pipeline.id}
          depends_on:
            - task_key: wikipedia_raw