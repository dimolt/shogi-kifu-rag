resources:
  pipelines:
    shogi_kif_pipeline:
      name: shogi_kif_pipeline
      root_path: ../../..
      configuration:
        bundle.catalog: "${var.catalog}"
        bundle.landing_schema: "${var.landing_schema}"
        bundle.silver_schema: "${var.silver_schema}"
        bundle.gold_schema: "${var.gold_schema}"
      libraries:
        - glob:
            include: ../../pipelines/shogi_kif_tables.py
        - glob:
            include: ../../transforms/**
        - glob:
            include: ../../utils/**
      photon: true
      catalog: "${var.catalog}"
      schema: "${var.silver_schema}"
      serverless: true
      continuous: false
      environment:
        dependencies: ${var.wheel_dependencies}