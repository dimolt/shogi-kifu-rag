resources:
  pipelines:
    joseki_pipeline:
      name: joseki_pipeline
      root_path: ../../..
      configuration:
        bundle.catalog: "${var.catalog}"
        bundle.bronze_schema: "${var.bronze_schema}"
        bundle.silver_schema: "${var.silver_schema}"
        bundle.gold_schema: "${var.gold_schema}"
      libraries:
        - glob:
            include: ../../pipelines/joseki_tables.py
        - glob:
            include: ../../transforms/**
        - glob:
            include: ../../utils/**
      photon: true
      catalog: "${var.catalog}"
      schema: "${var.silver_schema}"
      serverless: true
      continuous: false
      environment:
        dependencies: ${var.wheel_dependencies}
